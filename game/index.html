<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Museum Malam — Pencuri Bayangan</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d13; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; background: #14161d; }
  /* Dibacakan saja, tak pernah tampil: status untuk pembaca layar. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Museum Malam: game stealth top-down. Gerakkan Raka dengan WASD, lari dengan Shift, merangkak dengan C, hindari kerucut pandang satpam dan capai pintu keluar."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
